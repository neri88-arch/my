[package]
name = "parquet_tokenizer_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
parquet = "54"
arrow = "54"
arrow-array = "54"
rayon = "1.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
